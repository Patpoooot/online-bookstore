server:
  port: ${SERVER_PORT:8084}

spring:
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/order_db}
    username: ${DB_USERNAME:bookstore}
    password: ${DB_PASSWORD:bookstore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # the schema is owned by Flyway (src/main/resources/db/migration)
  flyway:
    enabled: true

# Exposes GET /health (required by the deployment health checks)
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # Correlation ID propagated by the API Gateway (header X-Correlation-Id, MDC key correlationId)
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

bookstore:
  clients:
    inventory:
      base-url: ${INVENTORY_URL:http://localhost:8083}
    payment:
      # The simulated Payment endpoint lives in this service (package "payment");
      # the URL is configurable so that tests can point it to a WireMock stub.
      base-url: ${PAYMENT_URL:http://localhost:8084}
    connect-timeout: 2s
    read-timeout: 5s
