server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/auth_db}
    username: ${DB_USERNAME:bookstore}
    password: ${DB_PASSWORD:bookstore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # the schema is owned by Flyway (src/main/resources/db/migration)
  flyway:
    enabled: true

# Exposes GET /health (required by the deployment health checks)
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    # Correlation ID propagated by the API Gateway (header X-Correlation-Id, MDC key correlationId)
    level: "%5p [${spring.application.name},%X{correlationId:-}]"

bookstore:
  jwt:
    # Must be identical to the API Gateway secret (HMAC-SHA256, at least 32 bytes).
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    expiration: ${JWT_EXPIRATION:PT2H}
