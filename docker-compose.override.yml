# Local development / CI additions, loaded automatically by "docker compose" next to docker-compose.yml.
# - builds the service images from the sources (build context = repository root)
# - publishes the database and service ports on localhost for debugging
# Not shipped to the demo machine (only docker-compose.yml is).

services:
  auth-db:
    ports: ["5433:5432"]
  catalog-db:
    ports: ["5434:5432"]
  order-db:
    ports: ["5435:5432"]
  inventory-db:
    ports: ["3307:3306"]

  auth-service:
    build: { context: ., dockerfile: auth-service/Dockerfile }
    ports: ["8081:8081"]
  catalog-service:
    build: { context: ., dockerfile: catalog-service/Dockerfile }
    ports: ["8082:8082"]
  inventory-service:
    build: { context: ., dockerfile: inventory-service/Dockerfile }
    ports: ["8083:8083"]
  order-service:
    build: { context: ., dockerfile: order-service/Dockerfile }
    ports: ["8084:8084"]
  api-gateway:
    build: { context: ., dockerfile: api-gateway/Dockerfile }
