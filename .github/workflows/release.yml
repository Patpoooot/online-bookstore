# Versioned images and GitHub Release (README §5.3 and §5.4)
# Triggered by pushing a version tag, e.g.:  git tag v1.0.0 && git push origin v1.0.0
#  - builds and pushes each service image to GHCR tagged with the version (1.0.0)
#  - builds the JavaFX client installers (Linux .deb, Windows .msi, macOS .dmg) with jpackage
#  - creates a GitHub Release with the installers and docker-compose.yml attached
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/online-bookstore

jobs:
  images:
    name: Push versioned image ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api-gateway, auth-service, catalog-service, inventory-service, order-service]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.ref_name }}

  installers:
    name: Client installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build installer with jpackage
        shell: bash
        # jpackage needs a numeric version: v1.2.3 -> 1.2.3
        run: scripts/package-client.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/*

  release:
    name: GitHub Release
    needs: [images, installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Pin the release version in docker-compose.yml
        run: |
          VERSION="${GITHUB_REF_NAME}"
          sed "s/\${IMAGE_TAG:-latest}/\${IMAGE_TAG:-$VERSION}/g" docker-compose.yml > dist/docker-compose.yml
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
